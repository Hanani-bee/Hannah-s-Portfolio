name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let one deploy finish before the next starts.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      - name: Build site
        env:
          # A project site lives at /<repo>, a user site at the root.
          # configure-pages reports which; strip the trailing slash so the
          # root case becomes an empty prefix rather than "/".
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}
        run: |
          BASE="${PAGES_BASE%/}"
          echo "Building with BASE_URL='${BASE}'"
          BASE_URL="${BASE}" npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
